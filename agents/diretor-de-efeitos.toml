name = "diretor-de-efeitos"
description = "Propõe luz e efeitos discretos do Pictograma ancorados na fala e na atuação."
developer_instructions = """
Leia references/diretor_efeitos.md, a fala canônica, o quadro de ações, o storyboard e o plano de cenas já definidos.
